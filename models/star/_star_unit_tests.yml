version: 2

unit_tests:
  - name: fct_orders_pivots_events_and_derives_outcome
    description: >
      Full build: one row per order, one timestamp per stage, dropoff taken from the
      last stage reached, outcome derived from fulfilment and dropoff.
    model: fct_orders
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_orders')
        rows:
          # 1: full path
          - {order_event_id: 1, order_id: 1, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-01 10:00:00'}
          - {order_event_id: 2, order_id: 1, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: payment,   dropoff_reason: null, updated_at: '2025-01-01 12:00:00'}
          - {order_event_id: 3, order_id: 1, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: fulfilled, dropoff_reason: null, updated_at: '2025-01-02 10:00:00'}
          # 2: dropped at created
          - {order_event_id: 4, order_id: 2, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: card_declined, updated_at: '2025-01-01 10:00:00'}
          # 3: dropped after payment
          - {order_event_id: 5, order_id: 3, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-01 10:00:00'}
          - {order_event_id: 6, order_id: 3, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: payment,   dropoff_reason: lost_in_shipping, updated_at: '2025-01-01 10:30:00'}
          # 4: paid, no dropoff yet
          - {order_event_id: 7, order_id: 4, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-01 10:00:00'}
          - {order_event_id: 8, order_id: 4, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: payment,   dropoff_reason: null, updated_at: '2025-01-01 11:00:00'}
    expect:
      rows:
        - {order_id: 1, created_at: '2025-01-01 10:00:00', creation_date_code: 20250101, paid_at: '2025-01-01 12:00:00', fulfilled_at: '2025-01-02 10:00:00', last_event_at: '2025-01-02 10:00:00', last_status: fulfilled, dropoff_stage: null,    dropoff_reason: null,             order_outcome: fulfilled,   hours_to_payment: 2.00, hours_to_fulfillment: 22.00}
        - {order_id: 2, created_at: '2025-01-01 10:00:00', creation_date_code: 20250101, paid_at: null,                  fulfilled_at: null,                  last_event_at: '2025-01-01 10:00:00', last_status: created,   dropoff_stage: created, dropoff_reason: card_declined,    order_outcome: dropped,     hours_to_payment: null, hours_to_fulfillment: null}
        - {order_id: 3, created_at: '2025-01-01 10:00:00', creation_date_code: 20250101, paid_at: '2025-01-01 10:30:00', fulfilled_at: null,                  last_event_at: '2025-01-01 10:30:00', last_status: payment,   dropoff_stage: payment, dropoff_reason: lost_in_shipping, order_outcome: dropped,     hours_to_payment: 0.50, hours_to_fulfillment: null}
        - {order_id: 4, created_at: '2025-01-01 10:00:00', creation_date_code: 20250101, paid_at: '2025-01-01 11:00:00', fulfilled_at: null,                  last_event_at: '2025-01-01 11:00:00', last_status: payment,   dropoff_stage: null,    dropoff_reason: null,             order_outcome: in_progress, hours_to_payment: 1.00, hours_to_fulfillment: null}

  - name: fct_orders_incremental_new_orders_and_stages
    description: >
      The orders file is replaced by a newer one; default lookback 0, watermark
      2025-01-10 09:00 (max last_event_at already loaded).
      Order 1 gets a new stage and is rebuilt from all its events.
      Order 2 has its last event exactly at the watermark and is rebuilt unchanged.
      Order 6 is new and is inserted.
      Order 5 gets a late event older than the watermark: by the declared assumption it
      is not picked up (assert_fct_orders_in_sync_with_staging flags it; a --full-refresh
      fixes it).
    model: fct_orders
    overrides:
      macros:
        is_incremental: true
      vars:
        fct_orders_lookback_days: 0
    given:
      # SQL format: dbt does not need the existing table to infer the columns,
      # so the test also runs on a fresh database (first build).
      - input: this
        format: sql
        rows: |
          select 1 as order_id, '2025-01-08 09:00:00'::timestamp as last_event_at, '2025-01-08 23:00:00'::timestamp as insert_ts
          union all
          select 2, '2025-01-10 09:00:00'::timestamp, '2025-01-10 23:00:00'::timestamp
          union all
          select 5, '2025-01-01 09:00:00'::timestamp, '2025-01-01 23:00:00'::timestamp
      - input: ref('stg_orders')
        rows:
          - {order_event_id: 1, order_id: 1, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-08 09:00:00'}
          - {order_event_id: 2, order_id: 1, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: payment,   dropoff_reason: null, updated_at: '2025-01-11 09:00:00'}
          - {order_event_id: 3, order_id: 2, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-05 09:00:00'}
          - {order_event_id: 4, order_id: 2, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: payment,   dropoff_reason: null, updated_at: '2025-01-10 09:00:00'}
          - {order_event_id: 5, order_id: 5, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-01 09:00:00'}
          - {order_event_id: 6, order_id: 5, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: payment,   dropoff_reason: null, updated_at: '2025-01-09 09:00:00'}
          - {order_event_id: 7, order_id: 6, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-12 09:00:00'}
    expect:
      rows:
        - {order_id: 1, created_at: '2025-01-08 09:00:00', creation_date_code: 20250108, paid_at: '2025-01-11 09:00:00', last_event_at: '2025-01-11 09:00:00', last_status: payment, order_outcome: in_progress}
        - {order_id: 2, created_at: '2025-01-05 09:00:00', creation_date_code: 20250105, paid_at: '2025-01-10 09:00:00', last_event_at: '2025-01-10 09:00:00', last_status: payment, order_outcome: in_progress}
        - {order_id: 6, created_at: '2025-01-12 09:00:00', creation_date_code: 20250112, paid_at: null,                  last_event_at: '2025-01-12 09:00:00', last_status: created, order_outcome: in_progress}

  - name: fct_orders_lookback_catches_late_events
    description: >
      With a 3-day lookback (watermark 2025-01-10 09:00), order 1 gets a late payment
      event older than the watermark but inside the window: it is rebuilt and keeps the
      insert_ts of its first load. Order 5 has only old events and is not touched.
    model: fct_orders
    overrides:
      macros:
        is_incremental: true
      vars:
        fct_orders_lookback_days: 3
    given:
      - input: this
        format: sql
        rows: |
          select 1 as order_id, '2025-01-08 09:00:00'::timestamp as last_event_at, '2025-01-08 23:00:00'::timestamp as insert_ts
          union all
          select 2, '2025-01-10 09:00:00'::timestamp, '2025-01-09 23:00:00'::timestamp
          union all
          select 5, '2025-01-01 09:00:00'::timestamp, '2025-01-01 23:00:00'::timestamp
      - input: ref('stg_orders')
        rows:
          - {order_event_id: 1, order_id: 1, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-08 09:00:00'}
          - {order_event_id: 2, order_id: 1, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: payment,   dropoff_reason: null, updated_at: '2025-01-09 09:00:00'}
          - {order_event_id: 3, order_id: 2, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-05 09:00:00'}
          - {order_event_id: 4, order_id: 2, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: payment,   dropoff_reason: null, updated_at: '2025-01-10 09:00:00'}
          - {order_event_id: 5, order_id: 5, product_id: 10, customer_id: 100, shipping_company_id: 1, order_status: created,   dropoff_reason: null, updated_at: '2025-01-01 09:00:00'}
    expect:
      rows:
        - {order_id: 1, paid_at: '2025-01-09 09:00:00', last_event_at: '2025-01-09 09:00:00', last_status: payment, insert_ts: '2025-01-08 23:00:00'}
        - {order_id: 2, paid_at: '2025-01-10 09:00:00', last_event_at: '2025-01-10 09:00:00', last_status: payment, insert_ts: '2025-01-09 23:00:00'}

  - name: dim_customer_subscriptions_builds_contiguous_periods
    description: >
      One period per tier change: valid_to is the next valid_from, the last period is open
      (9999-12-31, is_current). An event repeating the current tier does not open a period.
    model: dim_customer_subscriptions
    given:
      - input: ref('stg_customers')
        rows:
          - {customer_id: 1, subs_tier: free,       updated_at: '2024-01-01 00:00:00'}
          - {customer_id: 1, subs_tier: premium,    updated_at: '2024-03-01 00:00:00'}
          - {customer_id: 1, subs_tier: premium,    updated_at: '2024-04-01 00:00:00'}
          - {customer_id: 1, subs_tier: enterprise, updated_at: '2024-06-01 00:00:00'}
          - {customer_id: 2, subs_tier: premium,    updated_at: '2024-02-01 00:00:00'}
    expect:
      rows:
        - {customer_id: 1, subs_tier: free,       valid_from: '2024-01-01 00:00:00', valid_to: '2024-03-01 00:00:00', is_current: false}
        - {customer_id: 1, subs_tier: premium,    valid_from: '2024-03-01 00:00:00', valid_to: '2024-06-01 00:00:00', is_current: false}
        - {customer_id: 1, subs_tier: enterprise, valid_from: '2024-06-01 00:00:00', valid_to: '9999-12-31 00:00:00', is_current: true}
        - {customer_id: 2, subs_tier: premium,    valid_from: '2024-02-01 00:00:00', valid_to: '9999-12-31 00:00:00', is_current: true}

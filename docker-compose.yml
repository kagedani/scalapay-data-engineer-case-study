services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: funnel_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  dbt:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # Run as the host user (exported by the Makefile) so files written to the
    # mounted project (target/, logs/, docs/img/) are not owned by root on Linux.
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    ports:
      - "8080:8080" # dbt docs serve
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DBT_PROFILES_DIR=/app
      - HOME=/tmp
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  postgres_data:

name: 'product_funnel_analysis'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'product_funnel_analysis'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # fct_orders incremental runs reprocess every order with an event newer than
  # max(last_event_at) - lookback, so late-arriving events inside the window are picked up.
  fct_orders_lookback_days: 3
  # Minimum days a subscription period must overlap the observation window
  # to be used in tier-level comparisons (is_comparable flag).
  min_exposure_days: 30

# Configuring models
models:
  product_funnel_analysis:
    staging:
      +schema: staging
      +materialized: view
      +docs:
        node_color: "lightblue"
    star:
      +schema: star
      +materialized: table
      +docs:
        node_color: "blue"
    mart:
      +schema: mart
      +materialized: table
      +docs:
        node_color: "darkblue"

seeds:
  product_funnel_analysis:
    +quote_columns: false
    +schema: raw_data
    customers:
      +column_types:
        updated_at: timestamp
    orders:
      +column_types:
        updated_at: timestamp
    products:
      +column_types:
        price: numeric(10, 2)

data_tests:
  product_funnel_analysis:
    +store_failures: true
